version: 0.2

# Runs weekly (or on a manual pipeline release). Builds both Lambda
# container images, runs Alembic migrations against Aurora, builds the
# frontend, and rolls all of it out. Every env var referenced below is set
# on the CodeBuild project in infra/modules/codepipeline/main.tf.

phases:
  install:
    runtime-versions:
      python: 3.11
      nodejs: 20

  pre_build:
    commands:
      # Commit SHA prefix for traceability + the CodeBuild build number so
      # re-running the pipeline against the same commit (weekly schedule
      # with no new commits, a manual re-trigger, a retry after a failure)
      # never reuses a tag -- the ECR repos are image_tag_mutability =
      # "IMMUTABLE", so a reused tag fails the docker push outright.
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-12)-$CODEBUILD_BUILD_NUMBER
      - ECR_REGISTRY_HOST=$(echo "$BACKEND_ECR_URL" | cut -d/ -f1)
      # privileged_mode's Docker daemon can still be starting up when
      # pre_build begins; wait for it rather than racing the first command.
      - for i in $(seq 1 30); do docker info > /dev/null 2>&1 && break; sleep 2; done
      - docker info
      # Split from `docker login` (previously one piped command) so a
      # future failure is attributable to a specific line instead of a
      # single ambiguous "exit status 1" covering both.
      - ECR_PASSWORD=$(aws ecr get-login-password --region "$AWS_DEFAULT_REGION")
      - echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY_HOST"

  build:
    commands:
      # --platform linux/amd64 matches the Lambda functions' explicit
      # architectures = ["x86_64"] (infra/modules/lambda/main.tf) — CodeBuild
      # already runs on x86_64 so this is redundant today, but pins the
      # invariant explicitly rather than relying on the runner's architecture.
      - docker build --platform linux/amd64 -t "$BACKEND_ECR_URL:$IMAGE_TAG" backend/
      - docker push "$BACKEND_ECR_URL:$IMAGE_TAG"
      - docker build --platform linux/amd64 -t "$WORKERS_ECR_URL:$IMAGE_TAG" workers/
      - docker push "$WORKERS_ECR_URL:$IMAGE_TAG"

      - pip install --quiet backend/.
      - DB_SECRET=$(aws secretsmanager get-secret-value --secret-id "$DB_MASTER_SECRET_ARN" --query SecretString --output text)
      - DB_USER=$(echo "$DB_SECRET" | python3 -c "import sys, json; print(json.load(sys.stdin)['username'])")
      - DB_PASSWORD=$(echo "$DB_SECRET" | python3 -c "import sys, json; print(json.load(sys.stdin)['password'])")
      - export DATABASE_URL="postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}"
      - (cd backend && alembic upgrade head)

      - corepack enable
      - cd frontend && pnpm install --frozen-lockfile && pnpm build && cd ..
      - aws s3 sync frontend/dist "s3://$FRONTEND_BUCKET" --delete
      - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

      - aws lambda update-function-code --function-name "$BACKEND_API_FUNCTION" --image-uri "$BACKEND_ECR_URL:$IMAGE_TAG" > /dev/null
      - aws lambda update-function-code --function-name "$RECOMMENDATION_ENGINE_FUNCTION" --image-uri "$BACKEND_ECR_URL:$IMAGE_TAG" > /dev/null
      - aws lambda update-function-code --function-name "$NIGHTLY_SCRAPE_FUNCTION" --image-uri "$WORKERS_ECR_URL:$IMAGE_TAG" > /dev/null
      - aws lambda update-function-code --function-name "$PROCESS_TRADE_MESSAGE_FUNCTION" --image-uri "$WORKERS_ECR_URL:$IMAGE_TAG" > /dev/null
